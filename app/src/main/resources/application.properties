# Tributary Application Configuration

# Spring Boot HTTP server configuration
server.port=8080
server.address=127.0.0.1

# Spring Boot gRPC server configuration
grpc.server.port=9090
grpc.server.address=127.0.0.1

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Logging configuration
logging.level.tributary=INFO
logging.level.io.grpc=INFO
logging.level.net.devh.boot.grpc=INFO

management.endpoint.health.group.readiness.include=readinessState,brokerReadiness
