syntax = "proto3";

package kaflow.v1;
option java_package = "kaflow.v1";
option java_multiple_files = true;
option java_outer_classname = "BrokerProtocol";

// Available only in the explicitly configured durable runtime after recovery.
service Broker {
  rpc Append(AppendRequest) returns (AppendResponse);
  rpc Join(JoinRequest) returns (MembershipResponse);
  rpc Heartbeat(HeartbeatRequest) returns (MembershipResponse);
  rpc Leave(LeaveRequest) returns (LeaveResponse);
  rpc Fetch(FetchRequest) returns (FetchResponse);
  rpc Commit(CommitRequest) returns (CommitResponse);
}

message AppendRequest {
  string topic = 1;
  optional int32 partition = 2;
  optional bytes key = 3;
  // Opaque application bytes, including empty and invalid UTF-8. Never Any.
  bytes payload = 4;
}

message TopicPartition {
  string topic = 1;
  int32 partition = 2;
}

message AppendResponse {
  TopicPartition partition = 1;
  int64 offset = 2; // Nonnegative, actual assigned partition offset.
  int64 timestamp_millis = 3; // Broker Unix timestamp in milliseconds.
}

// Labels are descriptive only; duplicate labels create separate sessions.
message JoinRequest {
  string group = 1;
  string topic = 2;
  string member_label = 3;
}

// Opaque broker-issued credentials; never log or derive authority from a label.
message SessionIdentity {
  string group = 1;
  string incarnation = 2;
  string session_token = 3;
}

message HeartbeatRequest {
  SessionIdentity session = 1;
}

message LeaveRequest {
  SessionIdentity session = 1;
}

message MembershipResponse {
  SessionIdentity session = 1;
  int64 generation = 2;
  int64 lease_duration_millis = 3; // Relative duration from application, not response receipt.
  repeated TopicPartition assignments = 4;
  // Same length/order as assignments; each value is the durable next offset.
  repeated int64 committed_next_offsets = 5;
}

message LeaveResponse {}

message FetchRequest {
  SessionIdentity session = 1;
  int64 generation = 2;
  TopicPartition partition = 3;
  int64 start_offset = 4;
  int32 max_records = 5;
  int64 max_bytes = 6; // Key plus payload; zero is valid.
}
message Record {
  TopicPartition partition = 1;
  int64 offset = 2;
  int64 timestamp_millis = 3;
  optional bytes key = 4;
  bytes payload = 5;
}
message FetchResponse {
  repeated Record records = 1;
  int64 next_offset = 2;
  int64 published_end = 3;
}
message CommitRequest {
  SessionIdentity session = 1;
  int64 generation = 2;
  TopicPartition partition = 3;
  int64 next_offset = 4;
}
message CommitResponse { int64 durable_next_offset = 1; }
