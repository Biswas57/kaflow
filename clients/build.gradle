plugins {
    id 'application'
    id 'com.google.protobuf' version '0.9.4'
}
apply from: rootProject.file('gradle/dependency-versions.gradle')
repositories { mavenCentral() }
dependencies {
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    implementation 'org.json:json:20230618'
    compileOnly 'jakarta.annotation:jakarta.annotation-api:1.3.5'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.3'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
application { mainClass = 'kaflow.clients.Main'; applicationName = 'kaflow-client'; applicationDefaultJvmArgs = ['-Xms64m', '-Xmx512m'] }
sourceSets.main.proto {
    srcDir rootProject.file('app/src/main/proto')
    include 'kaflow/v1/**'
}
protobuf {
    protoc { artifact = "com.google.protobuf:protoc:${protobufVersion}" }
    plugins { grpc { artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}" } }
    generateProtoTasks { all().each { task -> task.plugins { grpc {} } } }
}
tasks.named('test') { useJUnitPlatform() }
tasks.register('healthProbeJar', Jar) {
    dependsOn classes
    archiveFileName = 'healthcheck.jar'
    from(sourceSets.main.output) { include 'kaflow/clients/HealthProbe.class' }
}
